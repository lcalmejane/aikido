name: Distribution CI

on:
  push:
    branches: [main, 'release/**', 'feature/standardize-node-runtime']
    paths:
      - 'distribution/**'
      - 'prompts/hard_points/**'
      - 'LICENSE'
      - 'TRADEMARK.md'
      - '.github/workflows/distribution-*.yml'
  pull_request:
    paths:
      - 'distribution/**'
      - 'prompts/hard_points/**'
      - 'LICENSE'
      - 'TRADEMARK.md'
      - '.github/workflows/distribution-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: node {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test Node engines and generated packages
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'compatibility'], {stdio:'inherit'});
      - name: Install Claude Code validator for full suite
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'install-validator'], {stdio:'inherit'});
      - name: Test full distribution on minimum Node (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'tests'], {stdio:'inherit'});

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: node {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Install Claude Code plugin validator
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'install-validator'], {stdio:'inherit'});
      - name: Run tests
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'tests'], {stdio:'inherit'});
      - name: Prepare deterministic release tree
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'prepare-ci'], {stdio:'inherit'});
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aikido-dist-${{ github.sha }}
          path: ${{ runner.temp }}/aikido-dist
          include-hidden-files: true
          retention-days: 14
