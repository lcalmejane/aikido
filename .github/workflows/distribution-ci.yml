name: Distribution CI

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'distribution/**'
      - 'prompts/hard_points/**'
      - 'LICENSE'
      - 'TRADEMARK.md'
      - '.github/workflows/distribution-*.yml'
  pull_request:
    paths:
      - 'distribution/**'
      - 'prompts/hard_points/**'
      - 'LICENSE'
      - 'TRADEMARK.md'
      - '.github/workflows/distribution-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Install Claude Code plugin validator
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.310
      - name: Run tests
        run: node --test distribution/tests/*.test.mjs prompts/hard_points/system/orchestrator/*.test.mjs
      - name: Prepare deterministic release tree
        run: |
          node distribution/scripts/prepare-release.mjs \
            --out "$RUNNER_TEMP/aikido-dist" \
            --revision "$(git rev-parse HEAD)" \
            --version "1.5.0-ci.${{ github.run_number }}"
          node distribution/scripts/prepare-release.mjs --verify "$RUNNER_TEMP/aikido-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aikido-dist-${{ github.sha }}
          path: ${{ runner.temp }}/aikido-dist
          include-hidden-files: true
          retention-days: 14
