name: Distribution publish

# Manual only: publishing the generated branch requires a maintainer decision (D04).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (x.y.z or x.y.z-prerelease); creates tag aikido-dist-v<version>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: node {0}
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Check version and tag
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'check-tag'], {stdio:'inherit'});
      - name: Install Claude Code plugin validator
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'install-validator'], {stdio:'inherit'});
      - name: Run tests
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'tests'], {stdio:'inherit'});
      - name: Prepare and verify release tree
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'prepare-publish'], {stdio:'inherit'});
      - name: Commit generated tree to the dist branch and tag it
        run: require('node:child_process').execFileSync(process.execPath, ['distribution/scripts/ci.mjs', 'publish'], {stdio:'inherit'});
