# ============================================================
# Default configuration for the /skill-manage command
# File: prompts/hard_points/configuration/skills.cfg
# ============================================================
# The values defined here are used as a fallback when no
# argument is provided to /skill-manage (or its /skill-get shortcut).
# Any parameter passed as a CLI argument overrides these values.
# ============================================================

# ------------------------------------------------------------
# GIT SOURCE
# URL of the Git group/organization that hosts the skills
# Supported formats:
#   SSH   : git@gitlab.com:my-org/skills
#   HTTPS : https://github.com/my-org
#   Local : /path/to/group
# ⚠️ NEVER embed credentials in this URL (no https://user:token@host/...).
#    This file is versioned. Use SSH keys, a credential helper, or GIT_TOKEN
#    (see below) instead.
# ------------------------------------------------------------
GIT_GROUP=git@github.com:lcalmejane/aikido-skills

# Access token for private repositories (leave empty if public)
# ⚠️ NEVER COMMIT SECRETS IN THIS FILE (it is versioned).
# Provide the token via:
#   1. environment variable AIKIDO_GIT_TOKEN (recommended)
#   2. untracked local file: skills.local.cfg (same folder, git-ignored)
#      → contains only: GIT_TOKEN=xxxx
GIT_TOKEN=

# Default branch/tag to check out after cloning
# Examples: main, develop, latest, v1.0.0
GIT_DEFAULT_BRANCH=main

# ------------------------------------------------------------
# INSTALLATION
# Target directory where skills are installed
# Relative to the workspace root
# ------------------------------------------------------------
TARGET_DIR=prompts/hard_points/skills/
# Behavior when the skill is already installed:
#   update    → git pull on the existing version (default)
#   reinstall → delete and clone again
#   skip      → silently ignore
#   ask       → ask interactively
ON_CONFLICT=update

# Automatically run shell installation scripts (*.sh)
# without asking for confirmation (true/false)
# ⚠️ SECURITY: keep this at false. Skills come from third-party repositories;
# running their scripts automatically means executing untrusted code.
AUTO_RUN_SCRIPTS=false

# ------------------------------------------------------------
# DISPLAY
# ------------------------------------------------------------
# Verbose mode by default (true/false)
VERBOSE=true

# Maximum number of projects shown in the selection list
MAX_PROJECTS_DISPLAY=50

# Project list display format:
#   table    → table with number, name, description
#   list     → simple list of name + description
#   compact  → number + name only
DISPLAY_FORMAT=table

# ------------------------------------------------------------
# AI-KIDO SYSTEM REGISTRATION
# ------------------------------------------------------------
# Automatically update skills_list.md after installation
AUTO_UPDATE_SKILLS_LIST=true

# Automatically update commands_list.md if the skill
# exposes commands ("Available commands" section in SKILL.md)
AUTO_UPDATE_COMMANDS_LIST=true

# Automatically create the .roo/commands/ and .claude/commands/ mappings
# for each command exposed by the skill
AUTO_CREATE_COMMAND_MAPPINGS=true

# ------------------------------------------------------------
# VALIDATION
# ------------------------------------------------------------
# Validate the skill's AI-KIDO compliance after installation
# via agent-aikido-validator (true/false)
VALIDATE_AFTER_INSTALL=true

# Validation level:
#   strict  → block if SKILL.md is missing or non-compliant
#   warn    → warn but continue the installation
#   skip    → do not validate
VALIDATION_LEVEL=warn
