# ============================================================
# Configuration par défaut pour la commande /skill-get
# Fichier : prompts/hard_points/configuration/skills.cfg
# ============================================================
# Les valeurs définies ici sont utilisées comme fallback
# lorsqu'aucun argument n'est fourni à /skill-get.
# Tout paramètre passé en argument CLI surcharge ces valeurs.
# ============================================================

# ------------------------------------------------------------
# SOURCE GIT
# URL du groupe/organisation Git contenant les skills
# Formats supportés :
#   SSH   : git@gitlab.com:mon-org/skills
#   HTTPS : https://github.com/mon-org
#   Local : /chemin/vers/groupe
# ------------------------------------------------------------
GIT_GROUP=git@github.com:lcalmejane/aikido-skills

# Token d'accès pour les dépôts privés (laisser vide si public)
# ⚠️ NEVER COMMIT SECRETS IN THIS FILE (it is versioned).
# Provide the token via:
#   1. environment variable AIKIDO_GIT_TOKEN (recommended)
#   2. untracked local file: skills.local.cfg (same folder, git-ignored)
#      → contains only: GIT_TOKEN=xxxx
GIT_TOKEN=

# Branche/tag par défaut à checkout après clonage
# Exemples : main, develop, latest, v1.0.0
GIT_DEFAULT_BRANCH=main

# ------------------------------------------------------------
# INSTALLATION
# Répertoire cible d'installation des skills
# Relatif à la racine du workspace
# ------------------------------------------------------------
TARGET_DIR=prompts/hard_points/skills/
# Comportement si le skill est déjà installé :
#   update    → git pull sur la version existante (défaut)
#   reinstall → supprimer et recloner
#   skip      → ignorer silencieusement
#   ask       → demander interactivement
ON_CONFLICT=update

# Exécuter automatiquement les scripts d'installation shell (*.sh)
# sans demander confirmation (true/false)
AUTO_RUN_SCRIPTS=false

# ------------------------------------------------------------
# AFFICHAGE
# ------------------------------------------------------------
# Mode verbose par défaut (true/false)
VERBOSE=true

# Nombre maximum de projets affichés dans la liste de sélection
MAX_PROJECTS_DISPLAY=50

# Format d'affichage de la liste des projets :
#   table    → tableau avec numéro, nom, description
#   list     → liste simple nom + description
#   compact  → numéro + nom uniquement
DISPLAY_FORMAT=table

# ------------------------------------------------------------
# ENREGISTREMENT SYSTÈME AI-KIDO
# ------------------------------------------------------------
# Mettre à jour automatiquement skills_list.md après installation
AUTO_UPDATE_SKILLS_LIST=true

# Mettre à jour automatiquement commands_list.md si le skill
# expose des commandes (section "Commandes disponibles" dans SKILL.md)
AUTO_UPDATE_COMMANDS_LIST=true

# Créer automatiquement les mappings .roo/commands/ et .claude/commands/
# pour chaque commande exposée par le skill
AUTO_CREATE_COMMAND_MAPPINGS=true

# ------------------------------------------------------------
# VALIDATION
# ------------------------------------------------------------
# Valider la conformité AI-KIDO du skill après installation
# via agent-aikido-validator (true/false)
VALIDATE_AFTER_INSTALL=true

# Niveau de validation :
#   strict  → bloquer si SKILL.md absent ou non conforme
#   warn    → avertir mais continuer l'installation
#   skip    → ne pas valider
VALIDATION_LEVEL=warn
